<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EreziHub - Video Platform</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f0f0f; color: #fff; }
    header { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 14px 28px; border-bottom: 1px solid #2d2d2d; }
    .logo { font-weight: 900; font-size: 24px; text-decoration: none; }
    .logo-black { background: #000; color: #fff; padding: 4px 8px; border-radius: 4px; }
    .logo-orange { background: #ff9900; color: #000; padding: 4px 8px; border-radius: 4px; margin-left: 2px; }
    .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
    .upload-card { background: #1a1a1a; padding: 16px; border-radius: 8px; margin-bottom: 24px; display: flex; gap: 10px; }
    input[type="file"], input[type="text"] { background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; flex: 1; }
    button { background: #ff9900; color: #000; font-weight: bold; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .player-box { background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 24px; }
    video { width: 100%; max-height: 500px; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .video-card { background: #1a1a1a; border-radius: 6px; padding: 12px; border: 1px solid #2a2a2a; cursor: pointer; }
    .video-card:hover { border-color: #ff9900; }
  </style>
</head>
<body>
  <header>
    <a href="#" class="logo"><span class="logo-black">Erezi</span><span class="logo-orange">Hub</span></a>
  </header>
  <div class="container">
    <form class="upload-card" id="uploadForm">
      <input type="file" id="videoFileInput" accept="video/mp4" required />
      <input type="text" id="videoTitleInput" placeholder="Video Title..." required />
      <button type="submit" id="uploadBtn">Upload</button>
    </form>
    <div class="player-box" id="playerContainer" style="display:none;">
      <video id="mainPlayer" controls autoplay></video>
      <h2 id="activeVideoTitle" style="padding:12px;"></h2>
    </div>
    <h3>Uploaded Videos</h3>
    <div class="video-grid" id="videoGrid"></div>
  </div>
  <script>
    async function loadVideos() {
      const res = await fetch('/api/videos');
      const videos = await res.json();
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = videos.map(v => `
        <div class="video-card" onclick="playVideo('${v.filename}', '${v.title.replace(/'/g, "\\'")}')">
          ▶ <b>${v.title}</b>
        </div>
      `).join('');
    }

    function playVideo(filename, title) {
      document.getElementById('playerContainer').style.display = 'block';
      document.getElementById('activeVideoTitle').innerText = title;
      document.getElementById('mainPlayer').src = `/api/stream/${encodeURIComponent(filename)}`;
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = document.getElementById('videoFileInput').files[0];
      const title = document.getElementById('videoTitleInput').value;
      const formData = new FormData();
      formData.append('video', file);
      formData.append('title', title);
      await fetch('/api/upload', { method: 'POST', body: formData });
      document.getElementById('videoTitleInput').value = '';
      loadVideos();
    });

    loadVideos();
  </script>
</body>
</html>
