<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EreziHub - Premium Adult Streaming</title>
  <style>
    :root {
      --bg-main: #0b0b0b;
      --bg-card: #1b1b1b;
      --bg-header: #121212;
      --accent: #ff9900;
      --text-main: #ffffff;
      --text-muted: #888888;
      --border-color: #282828;
      --input-bg: #151515;
    }

    html.light-mode, body.light-mode {
      --bg-main: #f0f2f5 !important;
      --bg-card: #ffffff !important;
      --bg-header: #ffffff !important;
      --accent: #ff9900 !important;
      --text-main: #111111 !important;
      --text-muted: #65676b !important;
      --border-color: #dddddd !important;
      --input-bg: #e4e6eb !important;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); font-size: 14px; min-height: 100vh; }

    /* Modal Overlay Fix */
    #ageGateModal { 
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
      background: #000000; z-index: 9999999; display: flex; 
      align-items: center; justify-content: center; text-align: center; 
    }
    .age-box { 
      background: #161616; padding: 40px; border-radius: 8px; 
      border: 1px solid #ff9900; max-width: 480px; width: 90%; 
    }
    .age-box h1 { font-size: 26px; margin-bottom: 16px; font-weight: 900; color: #fff; }
    .age-box p { color: #aaa; margin-bottom: 24px; line-height: 1.5; font-size: 13px; }

    /* Universal Interactive Buttons */
    .btn { 
      padding: 8px 14px; border-radius: 3px; font-weight: bold; 
      cursor: pointer !important; border: none; font-size: 13px; 
      text-decoration: none; display: inline-block; text-align: center;
      position: relative; z-index: 10; pointer-events: auto !important;
    }
    .btn-orange { background: var(--accent); color: #000000; }
    .btn-dark { background: var(--border-color); color: var(--text-main); }

    /* Header Layout */
    header { background: var(--bg-header); border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 1000; }
    .header-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; max-width: 1400px; margin: 0 auto; gap: 12px; flex-wrap: wrap; }
    
    .logo { text-decoration: none; font-size: 24px; font-weight: 900; display: flex; align-items: center; }
    .logo .blk { background: #000000; color: #ffffff; padding: 3px 8px; border-radius: 3px; }
    .logo .org { background: var(--accent); color: #000000; padding: 3px 8px; border-radius: 3px; margin-left: 2px; }

    .search-box { display: flex; flex: 1; max-width: 500px; }
    .search-box input { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 14px; border-radius: 3px 0 0 3px; outline: none; }
    .search-box button { background: var(--accent); border: none; color: #000000; padding: 0 16px; font-weight: bold; cursor: pointer; border-radius: 0 3px 3px 0; }

    .nav-btns { display: flex; align-items: center; gap: 8px; }

    .sub-nav { background: #000000; border-bottom: 1px solid var(--border-color); }
    .sub-nav-inner { max-width: 1400px; margin: 0 auto; display: flex; gap: 18px; padding: 10px 20px; overflow-x: auto; }
    .sub-nav a { color: #cccccc; text-decoration: none; font-size: 13px; font-weight: bold; white-space: nowrap; }
    .sub-nav a:hover, .sub-nav a.active { color: var(--accent); }

    .container { max-width: 1400px; margin: 20px auto; padding: 0 16px; }

    .upload-panel { background: var(--bg-card); padding: 20px; border-radius: 4px; border: 1px solid var(--border-color); margin-bottom: 24px; display: none; flex-wrap: wrap; gap: 12px; }
    .upload-panel input, .upload-panel select { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 3px; flex: 1; min-width: 200px; outline: none; }

    .sort-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
    .sort-header h2 { font-size: 18px; text-transform: uppercase; border-left: 4px solid var(--accent); padding-left: 8px; color: var(--text-main); }

    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .video-card { background: var(--bg-card); border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); cursor: pointer; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100000; justify-content: center; align-items: center; }
    .modal-body { background: var(--bg-card); padding: 24px; border-radius: 4px; width: 90%; max-width: 400px; border: 1px solid var(--border-color); color: var(--text-main); }
    .modal-body input { width: 100%; padding: 10px; margin-bottom: 12px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 3px; }
  </style>
</head>
<body>

  <!-- Age Gate -->
  <div id="ageGateModal">
    <div class="age-box">
      <div class="logo" style="justify-content: center; margin-bottom: 20px;">
        <span class="blk">Erezi</span><span class="org">Hub</span>
      </div>
      <h1>AGE RESTRICTED CONTENT</h1>
      <p>You must be 18 years or older to enter EreziHub.</p>
      <button type="button" id="enterBtn" class="btn btn-orange" style="width: 100%; padding: 16px; font-size: 16px; margin-bottom: 12px;">I AM 18 OR OLDER - ENTER</button>
      <a href="https://google.com" class="btn btn-dark" style="width: 100%; padding: 10px; display: block; text-decoration: none;">EXIT</a>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="header-top">
      <a href="#" class="logo"><span class="blk">Erezi</span><span class="org">Hub</span></a>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search videos..." />
        <button id="searchBtn">Search</button>
      </div>
      <div class="nav-btns">
        <button type="button" id="themeToggleBtn" class="btn btn-dark">🌓 Theme</button>
        <div id="authButtons" style="display:inline-flex; gap:8px;"></div>
      </div>
    </div>
    <div class="sub-nav">
      <div class="sub-nav-inner">
        <a href="#" class="active" data-cat="All">HOME</a>
        <a href="#" data-cat="Straight">STRAIGHT</a>
        <a href="#" data-cat="Trending">TRENDING</a>
        <a href="#" data-cat="Entertainment">ENTERTAINMENT</a>
        <a href="#" data-cat="Music">MUSIC</a>
        <a href="#" data-cat="Vlogs">VLOGS</a>
      </div>
    </div>
  </header>

  <div class="container">
    <div id="bannerSection"></div>

    <form class="upload-panel" id="uploadForm">
      <h3 style="width:100%; color:var(--accent);">📹 Creator Upload Studio</h3>
      <input type="file" id="videoFileInput" accept="video/mp4,video/webm,video/mkv" required />
      <input type="text" id="videoTitleInput" placeholder="Video Title..." required />
      <input type="text" id="videoTagsInput" placeholder="Tags (comma-separated)" />
      <input type="text" id="videoDurationInput" placeholder="Duration (e.g. 12:45)" />
      <select id="videoCategoryInput">
        <option value="Straight">Straight</option>
        <option value="Trending">Trending</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Music">Music</option>
        <option value="Vlogs">Vlogs</option>
      </select>
      <button type="submit" class="btn btn-orange" id="uploadBtn">Publish Video</button>
    </form>

    <div id="adminControlArea"></div>

    <div class="sort-header">
      <h2 id="currentCategoryHeading">All Videos</h2>
    </div>

    <div class="video-grid" id="videoGrid"></div>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-body">
      <h2 style="margin-bottom:16px;">Log In</h2>
      <input type="text" id="loginUser" placeholder="Username" />
      <input type="password" id="loginPass" placeholder="Password" />
      <button type="button" class="btn btn-orange" id="submitLoginBtn" style="width:100%; margin-bottom:8px;">Log In</button>
      <button type="button" class="btn btn-dark" id="closeLoginBtn" style="width:100%;">Cancel</button>
    </div>
  </div>

  <!-- Sign Up Modal -->
  <div class="modal-overlay" id="registerModal">
    <div class="modal-body">
      <h2 style="margin-bottom:16px;">Create Account</h2>
      <input type="text" id="regUser" placeholder="Username" />
      <input type="password" id="regPass" placeholder="Password" />
      <button type="button" class="btn btn-orange" id="submitRegBtn" style="width:100%; margin-bottom:8px;">Register</button>
      <button type="button" class="btn btn-dark" id="closeRegBtn" style="width:100%;">Cancel</button>
    </div>
  </div>

  <script>
    // --- 1. ABSOLUTE DIRECT STATE INITIALIZATION ---
    function applySavedTheme() {
      if (localStorage.getItem('ereziTheme') === 'light') {
        document.documentElement.classList.add('light-mode');
        document.body.classList.add('light-mode');
      } else {
        document.documentElement.classList.remove('light-mode');
        document.body.classList.remove('light-mode');
      }
    }
    applySavedTheme();

    if (localStorage.getItem('ageVerified') === 'true') {
      document.getElementById('ageGateModal').style.display = 'none';
    }

    let currentUser = JSON.parse(localStorage.getItem('ereziUser')) || null;

    // --- 2. DELEGATED CLICK LISTENERS (CANNOT BE BLOCKED OR UNBOUND) ---
    window.addEventListener('click', function(e) {
      // Age Gate Enter
      if (e.target && e.target.id === 'enterBtn') {
        document.getElementById('ageGateModal').style.display = 'none';
        localStorage.setItem('ageVerified', 'true');
      }

      // Theme Toggle
      if (e.target && (e.target.id === 'themeToggleBtn' || e.target.closest('#themeToggleBtn'))) {
        const isLight = document.body.classList.toggle('light-mode');
        document.documentElement.classList.toggle('light-mode', isLight);
        localStorage.setItem('ereziTheme', isLight ? 'light' : 'dark');
      }

      // Modals Triggering
      if (e.target && e.target.id === 'openLoginBtn') document.getElementById('loginModal').style.display = 'flex';
      if (e.target && e.target.id === 'closeLoginBtn') document.getElementById('loginModal').style.display = 'none';
      if (e.target && e.target.id === 'openRegBtn') document.getElementById('registerModal').style.display = 'flex';
      if (e.target && e.target.id === 'closeRegBtn') document.getElementById('registerModal').style.display = 'none';

      // Login Action
      if (e.target && e.target.id === 'submitLoginBtn') handleLogin();
      // Register Action
      if (e.target && e.target.id === 'submitRegBtn') handleRegister();
      // Logout Action
      if (e.target && e.target.id === 'logoutBtn') handleLogout();
    });

    // --- 3. AUTHENTICATION ENGINE ---
    function renderAuthUI() {
      const authDiv = document.getElementById('authButtons');
      const uploadPanel = document.getElementById('uploadForm');

      if (currentUser) {
        authDiv.innerHTML = `
          <span style="font-weight:bold; padding: 8px;">${currentUser.username}</span>
          <button type="button" id="logoutBtn" class="btn btn-dark">Log Out</button>
        `;
        if (currentUser.role === 'admin' || currentUser.uploaderStatus === 'approved') {
          uploadPanel.style.display = 'flex';
        }
      } else {
        authDiv.innerHTML = `
          <button type="button" id="openLoginBtn" class="btn btn-orange">Log In</button>
          <button type="button" id="openRegBtn" class="btn btn-dark">Sign Up</button>
        `;
        uploadPanel.style.display = 'none';
      }
    }

    async function handleLogin() {
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value.trim();
      if (!username || !password) return alert('Enter username and password');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          currentUser = data;
          localStorage.setItem('ereziUser', JSON.stringify(currentUser));
          document.getElementById('loginModal').style.display = 'none';
          renderAuthUI();
        } else {
          alert(data.error || 'Invalid credentials');
        }
      } catch(err) {
        alert('Server connectivity issue. Try again.');
      }
    }

    async function handleRegister() {
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value.trim();
      if (!username || !password) return alert('Enter username and password');

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        currentUser = data;
        localStorage.setItem('ereziUser', JSON.stringify(currentUser));
        document.getElementById('registerModal').style.display = 'none';
        renderAuthUI();
      } else {
        alert(data.error);
      }
    }

    function handleLogout() {
      currentUser = null;
      localStorage.removeItem('ereziUser');
      renderAuthUI();
    }

    // Init UI
    renderAuthUI();
  </script>
</body>
</html>
